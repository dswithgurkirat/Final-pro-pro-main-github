<!-- Fixed right-side PDF Preview Panel (Front Matter, Chapters, Plates) -->
<aside id="pdf-preview-panel" class="preview-panel pdf-preview-panel" aria-label="PDF Preview">
  <div class="pdf-preview-hd preview-hd">
    <div class="pdf-preview-hd-info">
      <h4 id="pdf-preview-title">PDF Preview</h4>
      <span id="pdf-preview-page-count" class="pdf-preview-page-count"></span>
    </div>
    <div class="pdf-preview-toolbar">
      <button type="button" id="pdf-preview-zoom-out" class="pdf-preview-btn" title="Zoom Out" aria-label="Zoom Out">
        <i data-lucide="zoom-out"></i>
      </button>
      <span id="pdf-preview-zoom-lbl" class="pdf-preview-zoom-lbl">100%</span>
      <button type="button" id="pdf-preview-zoom-in" class="pdf-preview-btn" title="Zoom In" aria-label="Zoom In">
        <i data-lucide="zoom-in"></i>
      </button>
      <button type="button" id="pdf-preview-refresh" class="pdf-preview-btn" title="Refresh Preview" aria-label="Refresh Preview">
        <i data-lucide="refresh-cw"></i>
      </button>
      <button type="button" id="pdf-preview-fullscreen" class="pdf-preview-btn" title="Full Screen" aria-label="Full Screen">
        <i data-lucide="maximize-2"></i>
      </button>
      <button type="button" id="pdf-preview-download" class="pdf-preview-btn pdf-preview-btn-dl" title="Download Merged PDF" aria-label="Download Merged PDF">
        <i data-lucide="download"></i>
        <span>Download</span>
      </button>
    </div>
  </div>
  <div class="pdf-preview-body preview-body"></div>
</aside>
